<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NTA Logistics | Reset Password</title></head><body><p>Opening secure password reset…</p><script>
(() => {
  // Preserve Supabase PKCE ?code= and implicit-flow #access_token fragments.
  // The existing allowed reset URL remains valid, while the password form
  // is rendered on the original admin sign-in screen.
  const query = new URLSearchParams(window.location.search);
  query.set("auth", "reset-password");
  window.location.replace("/?" + query.toString() + window.location.hash);
})();
</script><noscript><p>Enable JavaScript to finish resetting your password.</p></noscript></body></html>
